<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7efe6"/>
      <stop offset="60%" stop-color="#e9dcc9"/>
      <stop offset="100%" stop-color="#d2b48c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <text x="80" y="120" fill="#2b241f" font-family="Georgia, serif" font-size="48" font-weight="700">SIDEBAR BANNER DEMO</text>
  <rect x="80" y="180" width="1040" height="560" rx="28" fill="#ffffff" fill-opacity="0.06"/>
  <text x="100" y="280" fill="#2b241f" font-family="Arial, sans-serif" font-size="28">Tall portrait banner for sidebar widgets</text>
  <text x="100" y="340" fill="#3a3128" font-family="Arial, sans-serif" font-size="18">Recommended aspect ratio: 3:4 (1200×1600)</text>
  <g transform="translate(100,420)">
    <rect x="0" y="0" width="420" height="420" rx="18" fill="#ffffff" fill-opacity="0.04"/>
    <text x="28" y="240" fill="#f7efe0" font-family="Arial, sans-serif" font-size="22">Author / Callout</text>
  </g>
</svg>
